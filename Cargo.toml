[workspace]
members = ["crates/*"]

# Denied only in library crates: each crates/* manifest opts in via `[lints] workspace = true`.
# The root binary crate deliberately does not inherit these (`.expect("reason")` allowed in main.rs).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package]
name = "myproject"
version = "0.1.4"
edition = "2024"

[dependencies]
myproject-core = { path = "crates/core" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
